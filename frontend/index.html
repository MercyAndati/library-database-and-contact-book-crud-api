<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Contact Book</h1>
    
    <div class="forms-container">
        <!-- Contact Form -->
        <div class="form-section">
            <h2 id="contact-form-title">Add New Contact</h2>
            <form id="contact-form">
                <div>
                    <label>First Name:</label>
                    <input type="text" id="first_name" required>
                </div>
                <div>
                    <label>Last Name:</label>
                    <input type="text" id="last_name" required>
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" id="email">
                </div>
                <button type="submit">Add Contact</button>
                <button type="button" id="cancel-edit" style="display:none">Cancel</button>
            </form>
        </div>

        <!-- Phone Form -->
        <div class="form-section">
            <h2 id="phone-form-title">Add Phone Number</h2>
            <form id="phone-form">
                <div>
                    <label>Contact:</label>
                    <select id="contact_id" required>
                        <option value="">Select Contact</option>
                    </select>
                </div>
                <div>
                    <label>Phone Type:</label>
                    <select id="phone_type" required>
                        <option value="home">Home</option>
                        <option value="work">Work</option>
                        <option value="mobile" selected>Mobile</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label>Phone Number:</label>
                    <input type="text" id="phone_number" required>
                </div>
                <button type="submit">Add Phone</button>
                <button type="button" id="cancel-phone-edit" style="display:none">Cancel</button>
            </form>
        </div>
    </div>

    <div class="contacts-list">
        <h2>Contacts</h2>
        <div id="contacts-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
